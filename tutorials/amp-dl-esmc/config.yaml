# AMP 深度学习肽预测 — 端到端配置
# 优先 ESM-C；不可用自动回退 ESM-2 / handcrafted
# 无 torch 时自动跳过 MLP，只跑经典 ML

project:
  name: amp-dl-esmc
  seed: 42
  output_dir: outputs
  cache_dir: .cache

data:
  train_csv: data/demo/train.csv
  test_csv: data/demo/test.csv
  seq_col: sequence
  label_col: label
  min_len: 5
  max_len: 60
  alphabet: ACDEFGHIKLMNPQRSTVWY

split:
  test_size: 0.2
  val_size: 0.1
  stratify: true

features:
  backend: auto          # auto | esmc | esm2 | handcrafted
  pooling: mean          # mean | cls | mean+max
  batch_size: 8
  max_seq_len: 60
  device: auto           # auto | cuda | cpu

  esmc:
    model_name: esmc_300m
    use_api: false
    api_model: esmc-300m-2024-12
    api_url: https://forge.evolutionaryscale.ai

  esm2:
    model_name: esm2_t12_35M_UR50D
    repr_layer: 12

model:
  classical:
    - logistic
    - random_forest
    - xgboost_like
  dl:
    enabled: true        # torch 缺失时脚本会自动 skip
    type: mlp
    hidden: [256, 64]
    dropout: 0.3
    epochs: 40
    lr: 0.001
    weight_decay: 1.0e-4
    batch_size: 32
    patience: 8

train:
  cv_folds: 5
  metrics: [accuracy, precision, recall, f1, roc_auc, mcc]

predict:
  input_fasta: data/demo/to_predict.fasta
  threshold: 0.5
